name: JSON Linter

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  json_linter_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start JSON Linter
        run: |
          npm install -g @prantlf/jsonlint
          jsonlint DataSchema.json
